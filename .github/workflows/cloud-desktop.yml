name: cloud-desktop

on:
  workflow_dispatch:

permissions:
  gists: write

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Install desktop + VNC + tmate
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xfce4 xfce4-terminal xvfb x11vnc novnc websockify tmate
          echo "install done"
          ls /usr/share/novnc/vnc.html && echo "novnc ok"

      - name: Start virtual desktop
        run: |
          export DISPLAY=:1
          Xvfb :1 -screen 0 1280x800x24 &
          sleep 3
          dbus-launch xfce4-session &
          sleep 5
          x11vnc -display :1 -nopw -forever -localhost -shared -rfbport 5900 \
            > /tmp/vnc.log 2>&1 &
          sleep 3
          websockify --web /usr/share/novnc 6080 localhost:5900 \
            > /tmp/novnc.log 2>&1 &
          sleep 3
          echo "=== desktop ready (VNC 5900, noVNC 6080) ==="
          cat /tmp/vnc.log | head -5

      - name: Publish access via tmate
        run: |
          # tmate 建立共享会话 + 转发 noVNC 端口 6080（-L 是 tmate 顶层选项）
          tmate -S /tmp/tmate.sock -L 6080 new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          WEB=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')
          SSH=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          echo "=== TMATE WEB ==="
          echo "$WEB"
          echo ""
          echo "=== TMATE SSH ==="
          echo "$SSH"
          echo ""
          echo "连接方法：浏览器打开 TMATE WEB 链接 → 页面找 6080 端口转发 → 打开 noVNC 网页"
          echo "桌面：Xfce4 1280x800，预装 xfce4-terminal"
          echo "=== 中转到 gist（token 可读）==="
          cat > /tmp/gist.json << GEOF
          {
            "description": "cloud desktop access run $GITHUB_RUN_ID",
            "public": false,
            "files": {
              "tmate-conn.txt": {
                "content": "TMATE_WEB: $WEB\nTMATE_SSH: $SSH\n"
              }
            }
          }
          GEOF
          curl -sL -X POST -H "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/gists -d @/tmp/gist.json -o /tmp/gist-resp.json
          echo "gist id: $(grep -o '"id":"[^"]*' /tmp/gist-resp.json | head -1)"
          echo "=== 会话保持（近 6 小时）==="
          sleep 20400
