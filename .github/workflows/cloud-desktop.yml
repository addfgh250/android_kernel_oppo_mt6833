name: cloud-desktop

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Install desktop + VNC
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xfce4 xfce4-terminal xvfb x11vnc novnc websockify curl \
            > /dev/null 2>&1
          echo "install done"
          ls /usr/share/novnc/vnc.html && echo "novnc ok"

      - name: Install cloudflared
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: Start virtual desktop
        run: |
          export DISPLAY=:1
          Xvfb :1 -screen 0 1280x800x24 &
          sleep 3
          xfce4-session &
          sleep 5
          x11vnc -display :1 -nopw -forever -localhost -shared -rfbport 5900 \
            > /tmp/vnc.log 2>&1 &
          sleep 3
          websockify --web /usr/share/novnc 6080 localhost:5900 \
            > /tmp/novnc.log 2>&1 &
          sleep 3
          echo "=== desktop ready (VNC 5900, noVNC 6080) ==="

      - name: Publish via cloudflared tunnel
        run: |
          nohup /tmp/cloudflared tunnel --url http://localhost:6080 \
            > /tmp/cf.log 2>&1 &
          # 等待 trycloudflare URL 出现（最多 60 秒）
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done
          echo ""
          echo "############################################################"
          echo "=== 云桌面地址（浏览器直接打开，noVNC 网页）==="
          echo "$URL"
          echo "############################################################"
          echo "桌面：Xfce4 1280x800，会话保持近 6 小时"
          echo "若上面 URL 为空，看 /tmp/cf.log 或稍等后查看本步骤日志"
          sleep 20400
