          OPLUSEOF
          # lpm debug common 用 <gs/xxx.h> 尖括号（-I 到 debug/common 被剥），拷 gs/ 到标准 include 路径
          cp -r drivers/misc/mediatek/lpm/modules/debug/common/gs drivers/misc/mediatek/include/ 2>/dev/null || true
          # ufs-mtk-trace.h 同款问题（define_trace.h ./ 解析），显式补拷 + 诊断
          cp -n drivers/scsi/ufs/ufs-mtk-trace.h include/trace/ 2>/dev/null || true
          ls include/trace/ | grep -iE "ufs|inc" || echo "UFS TRACE MISSING"
          ls include/trace/ | head -20
          make olddefconfig
          # 注意：不开 DEBUG_INFO（会漂移数据符号地址，破坏与真机布局一致性）
