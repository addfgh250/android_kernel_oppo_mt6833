          # === measure-clang 追加：clang 测量环境 ===
          # mtk_mcdi_api.h：官方 repo 剥离 mcdi 头，sched/core.c 引号引用同目录解析
          cp -n drivers/misc/mediatek/base/power/mcdi/include/mtk_mcdi_api.h kernel/sched/ 2>/dev/null || true
          ls -la kernel/sched/mtk_mcdi_api.h 2>&1 || echo "MCDI HEADER MISSING"
          # 关 LTO/CFI（.o 才能反汇编，锚点尺寸对比用）
          scripts/config -d CONFIG_LTO -d CONFIG_LTO_CLANG -d CONFIG_THINLTO \
            -d CONFIG_CFI_CLANG -d CONFIG_CFI_CLANG_SHADOW -e CONFIG_LTO_NONE
          # 金丝雀只影响帧总尺寸 ±16B，局部变量相对 SP 偏移不变，测量仍可用
          scripts/config -d CONFIG_CC_STACKPROTECTOR -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -d CONFIG_CC_STACKPROTECTOR_REGULAR -e CONFIG_CC_STACKPROTECTOR_NONE
          scripts/config -d CONFIG_GCC_PLUGINS -d CONFIG_GCC_PLUGIN_ARM64 \
            -d CONFIG_GCC_PLUGIN_LATENT_ENTROPY -d CONFIG_GCC_PLUGIN_STACKLEAK 2>/dev/null || true
          scripts/config -d CONFIG_MODULES -d CONFIG_MODVERSIONS
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          echo "--- LTO/opt config ---"
          grep -E "^CONFIG_(LTO|THINLTO|CFI|CC_OPTIMIZE|STACKPROTECTOR|FRAME_POINTER)" .config || true

      - name: Build with gcc (baseline) + capture V=1 commands
        run: |
          set -x
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make -j4 CC=aarch64-linux-gnu-gcc-12 scripts > gcc-scripts.log 2>&1 || { echo "scripts prebuild FAILED"; tail -40 gcc-scripts.log; exit 1; }
          echo "scripts prebuild OK"
          # 强制 gcc 重编 4 个 .o，V=1 抓完整命令行
          touch kernel/futex.c fs/select.c kernel/locking/rtmutex.c kernel/sched/core.c
          make -j1 CC=aarch64-linux-gnu-gcc-12 V=1 \
            KCFLAGS="-Wno-error=format -Wno-error=address" \
            kernel/futex.o fs/select.o kernel/locking/rtmutex.o kernel/sched/core.o \
            > gcc-cmds.log 2>&1 || { echo "gcc build FAILED"; tail -40 gcc-cmds.log; exit 1; }
          echo "=== gcc OK, captured command samples ==="
          grep "aarch64-linux-gnu-gcc-12" gcc-cmds.log | head -6
          ls -la kernel/futex.o fs/select.o kernel/locking/rtmutex.o kernel/sched/core.o

      - name: Rebuild 4 objects with clang (same command lines)
        run: |
          python3 << 'PYEOF'
          import re, subprocess, sys, os
          log = open('gcc-cmds.log').read()
          targets = {
              'kernel/futex.o': 'kernel/futex.c',
              'fs/select.o': 'fs/select.c',
              'kernel/locking/rtmutex.o': 'kernel/locking/rtmutex.c',
              'kernel/sched/core.o': 'kernel/sched/core.c',
          }
          cmds = {}
          for line in log.splitlines():
              line = line.strip()
              if not line.startswith('aarch64-linux-gnu-gcc-12'):
                  continue
              for obj, src in targets.items():
                  if obj in line and src in line:
                      cmds[obj] = line
          missing = [t for t in targets if t not in cmds]
          if missing:
              print("MISSING captured commands for:", missing)
              print("--- full gcc-cmds.log tail ---")
              print('\n'.join(log.splitlines()[-40:]))
              sys.exit(1)
          print("captured %d/4 command lines" % len(cmds))
          clang = ('clang --target=aarch64-linux-gnu -Qunused-arguments '
                   '-Wno-unknown-warning-option -Wno-ignored-optimization-argument '
                   '-Wno-unused-command-line-argument')
          logf = open('clang-build.log', 'w')
          ok = True
          for obj in ['kernel/futex.o', 'fs/select.o', 'kernel/locking/rtmutex.o', 'kernel/sched/core.o']:
              cmd = cmds[obj].replace('aarch64-linux-gnu-gcc-12', clang, 1)
              # 剥掉 gcc 插件/专属旗标（若存在）
              for bad in ['-fplugin=', '-fno-var-tracking-assignments ']:
                  cmd = cmd.replace(bad, '')
              print("### %s" % obj, file=logf, flush=True)
              r = subprocess.run(['bash', '-c', cmd], capture_output=True, text=True)
              logf.write(r.stdout)
              logf.write(r.stderr)
              logf.flush()
              rc = r.returncode
              print("%s rc=%d" % (obj, rc))
              if rc != 0:
                  ok = False
                  print("--- errors ---")
                  for l in (r.stderr + r.stdout).splitlines()[-20:]:
                      print("ERR|", l)
          logf.close()
          print("=== objects after clang ===")
          subprocess.run(['ls', '-la'] + list(targets.keys()))
          if not ok:
              sys.exit(1)
          print("ALL 4 OBJECTS REBUILT WITH CLANG")
          PYEOF
          echo "=== clang error summary ==="
          grep -iE "error:" clang-build.log | head -20 || true

      - name: Disassemble + extract frames
        run: |
          OBJDUMP=$(which llvm-objdump-18 || which llvm-objdump-17 || which llvm-objdump)
          mkdir -p disasm
          for obj in kernel/futex.o fs/select.o kernel/locking/rtmutex.o kernel/sched/core.o; do
            if [ -f "$obj" ]; then
              "$OBJDUMP" -d --no-show-raw-insn "$obj" > "disasm/$(echo $obj | tr '/' '_').txt" 2>/dev/null
            fi
          done
          ls -la disasm/
          python3 << 'PYEOF'
          import re, subprocess, os

          targets = [
            ('disasm/kernel_futex.o.txt', ['futex_wait_requeue_pi', 'do_futex', 'SyS_futex']),
            ('disasm/fs_select.o.txt', ['core_sys_select', 'do_pselect', 'SyS_pselect6']),
            ('disasm/kernel_locking_rtmutex.o.txt', ['rt_mutex_adjust_prio_chain', 'rt_mutex_adjust_pi', 'rt_mutex_init_waiter']),
            ('disasm/kernel_sched_core.o.txt', ['__sched_setscheduler']),
          ]
          anchors = {'rt_mutex_adjust_prio_chain': 0x68c, 'rt_mutex_adjust_pi': 0xac,
                     '__sched_setscheduler': 0x1144}  # 真机 panic 实测函数尺寸

          for path, names in targets:
              if not os.path.exists(path):
                  print(f"!! missing {path}")
                  continue
              txt = open(path).read()
              # parse functions: addr <name>: then instructions
              funcs = {}
              order = []
              cur = None
              for line in txt.splitlines():
                  m = re.match(r'^([0-9a-f]+) <([^>]+)>:\s*$', line)
                  if m:
                      cur = int(m.group(1), 16)
                      funcs[cur] = [m.group(2), []]
                      order.append(cur)
                      continue
                  if cur is not None:
                      funcs[cur][1].append(line)
              addrs = sorted(funcs)
              print(f"\n===== {path} ({len(funcs)} funcs) =====")
              for name in names:
                  found = None
                  for a in addrs:
                      if funcs[a][0] == name:
                          found = a; break
                  if found is None:
                      print(f"-- {name}: NOT FOUND")
                      continue
                  size = None
                  for i, a in enumerate(addrs):
                      if a == found and i+1 < len(addrs):
                          size = addrs[i+1] - found
                  body = funcs[found][1]
                  print(f"\n== {name} size={'0x%x'%size if size else '?'}" +
                        (f"  [真机锚点 0x%x {'✓MATCH'%anchors[name] if size==anchors[name] else '✗DIFF'}]" % anchors[name] if name in anchors else ""))
                  print("  prologue (first 10):")
                  for l in body[:10]: print("   ", l.strip())
                  # rt_waiter 定位：futex_wait_requeue_pi 里 rt_mutex_init_waiter 调用前的 x0
                  if name == 'futex_wait_requeue_pi':
                      for i, l in enumerate(body):
                          if 'rt_mutex_init_waiter' in l:
                              print("  --- around rt_mutex_init_waiter call ---")
                              for k in range(max(0,i-8), min(len(body), i+2)):
                                  print("   ", body[k].strip())
                  if name == 'core_sys_select':
                      for i, l in enumerate(body):
                          if '__copy_from_user' in l:
                              print("  --- around __copy_from_user call (fds copy) ---")
                              for k in range(max(0,i-8), min(len(body), i+2)):
                                  print("   ", body[k].strip())
                  if name == 'rt_mutex_adjust_prio_chain' and size:
                      # 真机崩溃点 = 函数起始 +0x104 处应是 trylock 调用链
                      off = 0
                      print("  --- 指令 @+0xfc..+0x10c (真机崩点 LR=+0x104) ---")
                      for i, l in enumerate(body):
                          m = re.match(r'^\s*([0-9a-f]+):\s', l)
                          if m:
                              off = int(m.group(1),16) - found
                          if 0xfc <= off <= 0x10c:
                              print("   ", l.strip())
          PYEOF

      - name: Upload disasm
        uses: actions/upload-artifact@v4
        with:
          name: clang-frames-disasm
          path: |
            disasm/
            clang-build.log
            .config
