name: qemu-futex-test

on:
  workflow_dispatch:

jobs:
  qemu-futex:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout OPLUS futex sources (sparse)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kernel/futex.c
            kernel/locking/rtmutex.c
            kernel/locking/rtmutex_common.h
          sparse-checkout-cone-mode: false

      - name: Fetch generic 4.14.186
        run: |
          curl -sL https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.14.186.tar.xz -o k.tar.xz
          tar xJf k.tar.xz
          mv linux-4.14.186 linux-g

      - name: Swap in OPLUS futex/rtmutex
        run: |
          cp kernel/futex.c linux-g/kernel/futex.c
          cp kernel/locking/rtmutex.c linux-g/kernel/locking/rtmutex.c
          cp kernel/locking/rtmutex_common.h linux-g/kernel/locking/rtmutex_common.h
          echo "swapped markers:"
          grep -c "attach_to_pi_owner\|rt_mutex_start_proxy_lock" linux-g/kernel/futex.c linux-g/kernel/locking/rtmutex.c

      - name: Instrument futex EAGAIN paths
        run: |
          python3 << 'PYEOF'
          f = open('linux-g/kernel/futex.c').read()
          reps = [
            ('return ret ? ret : task_count;',
             'pr_info("FUTEX-DBG requeue-end ret=%d task_count=%d\\n", ret, task_count);\n\treturn ret ? ret : task_count;'),
            ('if (!top_waiter)\n\t\treturn 0;',
             'if (!top_waiter) {\n\t\tpr_info("FUTEX-DBG proxy no-waiter\\n");\n\t\treturn 0;\n\t}'),
            ('plist_for_each_entry_safe(this, next, &hb1->chain, list) {',
             'plist_for_each_entry_safe(this, next, &hb1->chain, list) {\n\t\tpr_info("FUTEX-DBG walk task_count=%d\\n", task_count);'),
            ('ret = rt_mutex_start_proxy_lock(',
             'pr_info("FUTEX-DBG proxy_lock call\\n");\n\t\t\tret = rt_mutex_start_proxy_lock('),
            ('fixup_pi_state_owner(u32 __user *uaddr, u32 __user *uaddr2,',
             'pr_info("FUTEX-DBG fixup_pi_state_owner ENTER\\n");\n\tfixup_pi_state_owner(u32 __user *uaddr, u32 __user *uaddr2,'),
            ('futex_wait_requeue_pi(u32 __user *uaddr, unsigned int flags,',
             'pr_info("FUTEX-DBG wait_requeue_pi ENTER\\n");\n\tfutex_wait_requeue_pi(u32 __user *uaddr, unsigned int flags,'),
          ]
          for a, b in reps:
            n = f.count(a)
            if n == 1:
              f = f.replace(a, b)
              print('OK:', a[:40])
            else:
              print('WARN count=%d:' % n, a[:40])
          open('linux-g/kernel/futex.c','w').write(f)
          print('total FUTEX-DBG:', f.count('FUTEX-DBG'))
          PYEOF

      - name: Install cross toolchain + qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu qemu-system-aarch64 cpio

      - name: Configure and build kernel
        run: |
          cd linux-g
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          scripts/config --enable CONFIG_FUTEX_PI
          scripts/config --enable CONFIG_RT_MUTEXES
          scripts/config --enable CONFIG_BLK_DEV_INITRD
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image > kbuild.log 2>&1 || {
            echo "=== BUILD FAILED, errors: ==="
            grep -E "error:|undefined reference" kbuild.log | head -30
            exit 1
          }
          echo "=== build OK, tail: ==="
          tail -3 kbuild.log
          ls -la arch/arm64/boot/Image

      - name: Build static repro and init
        run: |
          mkdir -p initramfs/proc initramfs/dev initramfs/sys
          cat > repro.c << 'EOF'
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdint.h>
          #include <string.h>
          #include <errno.h>
          #include <unistd.h>
          #include <pthread.h>
          #include <sys/syscall.h>
          #include <linux/futex.h>
          #include <time.h>

          static long futex(uint32_t *uaddr, int op, uint32_t val,
                            const struct timespec *timeout, uint32_t *uaddr2, uint32_t val3) {
            return syscall(SYS_futex, uaddr, op, val, timeout, uaddr2, val3);
          }
          static uint32_t f_wait, f_pi_target, f_pi_chain;
          static volatile int owner_ok, waiter_has_chain, owner_has_target, waiter_waiting;

          static void *owner_fn(void *a) {
            long r = futex(&f_pi_target, FUTEX_LOCK_PI, 0, NULL, NULL, 0);
            printf("REPRO owner LOCK_PI target ret=%ld errno=%d pi_target=%u\n", r, errno, f_pi_target);
            __sync_synchronize();
            owner_has_target = 1;
            while (!waiter_has_chain) { usleep(1000); }
            r = futex(&f_pi_chain, FUTEX_LOCK_PI, 0, NULL, NULL, 0);
            printf("REPRO owner LOCK_PI chain ret=%ld errno=%d chain=%u\n", r, errno, f_pi_chain);
            sleep(60);
            return NULL;
          }
          static void *waiter_fn(void *a) {
            long r = futex(&f_pi_chain, FUTEX_LOCK_PI, 0, NULL, NULL, 0);
            printf("REPRO waiter LOCK_PI chain ret=%ld errno=%d chain=%u\n", r, errno, f_pi_chain);
            __sync_synchronize();
            waiter_has_chain = 1;
            while (!owner_has_target) { usleep(1000); }
            struct timespec ts = { .tv_sec = 10 };
            __sync_synchronize();
            waiter_waiting = 1;
            r = futex(&f_wait, FUTEX_WAIT_REQUEUE_PI, 0, &ts, &f_pi_target, 0);
            printf("REPRO waiter WAIT_REQUEUE_PI ret=%ld errno=%d\n", r, errno);
            return NULL;
          }
          int main(void) {
            pthread_t o, w;
            pthread_create(&o, NULL, owner_fn, NULL);
            usleep(200000);
            pthread_create(&w, NULL, waiter_fn, NULL);
            while (!waiter_waiting) { usleep(1000); }
            for (int i = 1; i <= 3; i++) {
              errno = 0;
              long r = futex(&f_wait, FUTEX_CMP_REQUEUE_PI, 1, (void *)1, &f_pi_target, 0);
              printf("REPRO try=%d CMP_REQUEUE_PI ret=%ld errno=%d f_wait=%u pi_target=%u\n",
                     i, r, errno, f_wait, f_pi_target);
              sleep(1);
            }
            sleep(3);
            printf("REPRO done owner_ok=%d\n", owner_ok);
            return 0;
          }
          EOF
          aarch64-linux-gnu-gcc -static -O2 -pthread repro.c -o initramfs/repro
          cat > init.c << 'EOF2'
          #include <sys/syscall.h>
          #include <sys/mount.h>
          #include <sys/reboot.h>
          #include <sys/stat.h>
          #include <unistd.h>
          #include <stdio.h>
          int main(void) {
            mkdir("/proc", 0755);
            mkdir("/dev", 0755);
            mkdir("/sys", 0755);
            syscall(SYS_mount, "proc", "/proc", "proc", 0, 0);
            syscall(SYS_mount, "devtmpfs", "/dev", "devtmpfs", 0, 0);
            syscall(SYS_mount, "sysfs", "/sys", "sysfs", 0, 0);
            printf("=== QEMU futex repro start ===\n");
            fflush(stdout);
            execl("/repro", "repro", NULL);
            printf("exec failed\n");
            syscall(SYS_reboot, 0xfee1dead, 672274793, 0x4321fedc, NULL);
            return 0;
          }
          EOF2
          aarch64-linux-gnu-gcc -static -O2 init.c -o initramfs/init
          cd initramfs && find . | cpio -o -H newc | gzip > ../initramfs.cpio.gz
          ls -la ../initramfs.cpio.gz

      - name: Run QEMU test
        timeout-minutes: 6
        run: |
          timeout 240 qemu-system-aarch64 \
            -M virt -cpu cortex-a57 -m 512M -smp 4 -nographic -no-reboot \
            -kernel linux-g/arch/arm64/boot/Image \
            -initrd initramfs.cpio.gz \
            -append "console=ttyAMA0 earlycon rdinit=/init" > qemu.log 2>&1 || true
          echo "=== QEMU log tail ==="
          tail -150 qemu.log

      - name: Upload QEMU log
        uses: actions/upload-artifact@v4
        with:
          name: qemu-futex-log
          path: qemu.log
