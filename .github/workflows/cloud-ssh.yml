name: cloud-ssh

on:
  workflow_dispatch:

jobs:
  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Install openssh
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server > /dev/null 2>&1
          echo "installed"

      - name: Configure sshd
        run: |
          PASS=$(openssl rand -base64 9 | tr -d '/+=' | cut -c1-10)
          echo "runner:$PASS" | sudo chpasswd
          sudo mkdir -p /run/sshd
          echo "PasswordAuthentication yes" | sudo tee /etc/ssh/sshd_config.d/99-cloud.conf > /dev/null
          sudo sed -i 's/#\?Port 22/Port 2222/' /etc/ssh/sshd_config
          echo "$PASS" > /tmp/pass.txt

      - name: Start sshd + reverse tunnel (tuns.sh)
        run: |
          sudo /usr/sbin/sshd
          PASS=$(cat /tmp/pass.txt)
          # ssh -R 反向隧道到 tuns.sh（公共免费 sish 服务），无需下载客户端
          nohup ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 \
            -o ExitOnForwardFailure=yes \
            -R 0:localhost:2222 tuns.sh > /tmp/tuns.log 2>&1 &
          # 等 tuns.sh 分配端口（输出形如 "tuns.sh:12345"）
          for i in $(seq 1 30); do
            INFO=$(grep -aoE 'tuns\.sh:[0-9]+|forwarded.*port [0-9]+|[0-9a-z]+\.tuns\.sh' /tmp/tuns.log | head -2 | tr '\n' ' ')
            if [ -n "$INFO" ]; then break; fi
            sleep 3
          done
          echo ""
          echo "############################################################"
          echo "=== SSH 连接信息 ==="
          echo "隧道输出: $INFO"
          echo "密码: $PASS"
          echo "端口: 见隧道输出（tuns.sh:PORT 或类似格式）"
          echo "连接: ssh runner@tuns.sh -p <PORT>"
          echo "############################################################"
          echo "完整日志："
          cat /tmp/tuns.log
          sleep 20400
