name: redmi8a-bootextract

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download fastboot ROM (bigota CDN)
        run: |
          curl -L --retry 3 --retry-delay 5 -m 900 -o rom.tgz \
            -H "Referer: https://xiaomirom.com/rom/redmi-8a-olivelite-china-fastboot-recovery-rom/" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            "https://bigota.d.miui.com/V12.5.3.0.QCPCNXM/olivelite_images_V12.5.3.0.QCPCNXM_20211105.0000.00_10.0_cn_11862639cb.tgz" \
            || curl -L --retry 3 -m 900 -o rom.tgz \
            -H "User-Agent: Mozilla/5.0" \
            "https://bigota.d.miui.com/V12.5.3.0.QCPCNXM/olivelite_images_V12.5.3.0.QCPCNXM_20211105.0000.00_10.0_cn_11862639cb.tgz"
          ls -la rom.tgz
          file rom.tgz

      - name: Extract boot.img + vbmeta + flash scripts
        run: |
          mkdir -p out art
          tar xzf rom.tgz -C out 2>/dev/null || true
          find out -type f | head -40
          find out -name "boot.img" -exec cp {} art/ \; || true
          find out -name "vbmeta.img" -exec cp {} art/ \; || true
          find out -name "flash_all.sh" -exec cp {} art/ \; || true
          ls -la art/

      - name: Upload boot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redmi8a-boot-artifacts
          path: art/
          retention-days: 7
