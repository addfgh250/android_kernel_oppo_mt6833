name: build-systemmap-wiko
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'arch/arm64/configs/wiko_gar_an60_defconfig'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu libssl-dev flex bison bc
          aarch64-linux-gnu-gcc --version | head -1
      - name: Fetch OPLUS vendor tree
        run: |
          # OPPO 官方仓库缺 vendor 私有代码（symlink 断链 + 硬缺失），
          # 从完整备份仓库(MT6853 同代 BSP)拉取 vendor 树 + 参考内核树
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/whjddzyx/android_kernel_oppo_mtk6853 /tmp/ref-src
          cd /tmp/ref-src
          git sparse-checkout set vendor/oplus 4.14.186
          # symlink target 是 ../../vendor/... → 目标是工作区上级的兄弟目录
          mkdir -p "$GITHUB_WORKSPACE/../vendor"
          cp -r vendor/oplus "$GITHUB_WORKSPACE/../vendor/"
          # 用参考树补官方 repo 硬缺失的文件/symlink（-n 不覆盖已有）
          cp -rn 4.14.186/. "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          echo "vendor files: $(find "$GITHUB_WORKSPACE/../vendor" -type f | wc -l)"
          if [ -e kernel/sched_assist ]; then echo "SYMLINK RESOLVES"; else echo "SYMLINK BROKEN"; fi
      - name: Prepare config
        run: |
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          # 修复仍断链的 symlink
          find . -type l | while read L; do
            if [ ! -e "$L" ]; then
              T=$(readlink "$L")
              rm -f "$L"
              ln -s "$T" "$L"
              if [ ! -e "$L" ]; then
                echo "stub broken symlink: $L"
                rm -f "$L"; mkdir -p "$L"; touch "$L/Kconfig"
              else
                echo "rebuilt symlink: $L"
              fi
            fi
          done
          # 兜底: Kconfig source 引用缺失文件
          grep -rhoP 'source\s+"[^"]+"' --include='Kconfig*' . \
            | sed -E 's/.*"([^"]+)"/\1/' | grep -v '\$' | sort -u | while read F; do
              if [ ! -f "$F" ]; then
                echo "fix missing kconfig: $F"
                mkdir -p "$(dirname "$F")"; touch "$F"
              fi
            done
          # 关闭 OPLUS 特性宏（华为 BSP 无这些特性，关闭后 task_struct 等布局更接近真机）
          sed -i '/^ALLOWED_MCROS :=/,/^$/d' OplusKernelEnvConfig.mk
          sed -i '/^OPLUS_FEATURE_[A-Z0-9_]*$/d' OplusKernelEnvConfig.mk
          sed -i '/^OPLUS_BUG_[A-Z0-9_]*$/d' OplusKernelEnvConfig.mk
          sed -i '/^OPLUS_ARCH_[A-Z0-9_]*$/d' OplusKernelEnvConfig.mk
          sed -i 's/^KBUILD_CFLAGS += -DOPLUS_FEATURE_/#KBUILD_CFLAGS += -DOPLUS_FEATURE_/' Makefile
          sed -i 's/^KBUILD_CPPFLAGS += -DOPLUS_FEATURE_/#KBUILD_CPPFLAGS += -DOPLUS_FEATURE_/' Makefile
          sed -i 's/^CFLAGS_KERNEL += -DOPLUS_FEATURE_/#CFLAGS_KERNEL += -DOPLUS_FEATURE_/' Makefile
          sed -i 's/^CFLAGS_MODULE += -DOPLUS_FEATURE_/#CFLAGS_MODULE += -DOPLUS_FEATURE_/' Makefile
          cp arch/arm64/configs/wiko_gar_an60_defconfig .config
          # 真机(华为BSP)没有这些 OPPO 专属特性，显式关闭以对齐真机布局
          echo "# CONFIG_SCHED_ASSIST is not set" >> .config
          # 模块签名密钥：华为私有 pem 不存在，清空（不影响符号偏移）
          sed -i 's/^CONFIG_MODULE_SIG_KEY=.*/CONFIG_MODULE_SIG_KEY=""/' .config
          make olddefconfig
          echo "--- key config ---"
          grep -E "^CONFIG_(LOCALVERSION|MODULES|KALLSYMS|SECURITY_SELINUX|ARM64_VA_BITS|SCHED_ASSIST)" .config
      - name: Build vmlinux
        run: |
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc) vmlinux
      - name: Check System.map
        run: |
          ls -la System.map
          head -3 System.map
          echo "--- symbol check ---"
          grep -E " (init_task|selinux_state|init_cred|init_user_ns)$" System.map || true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: systemmap-wiko
          path: |
            System.map
            .config
