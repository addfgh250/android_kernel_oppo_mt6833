name: build-systemmap-wiko
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'arch/arm64/configs/wiko_gar_an60_defconfig'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu libssl-dev flex bison bc
          aarch64-linux-gnu-gcc --version | head -1
      - name: Fetch OPLUS vendor tree
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/whjddzyx/android_kernel_oppo_mtk6853 /tmp/vendor-src
          cd /tmp/vendor-src
          git sparse-checkout set vendor/oplus
          mkdir -p "$GITHUB_WORKSPACE/vendor"
          cp -r vendor/oplus "$GITHUB_WORKSPACE/vendor/"
          echo "vendor dirs: $(find "$GITHUB_WORKSPACE/vendor" -type d | wc -l)"
          echo "vendor files: $(find "$GITHUB_WORKSPACE/vendor" -type f | wc -l)"
          echo "--- symlink debug ---"
          ls -la kernel/sched_assist
          readlink kernel/sched_assist || echo "(not a symlink)"
          ls "$GITHUB_WORKSPACE/vendor/oplus/kernel/oplus_performance/sched_assist/sched_assist_mutex.h"
          if [ -e kernel/sched_assist ]; then echo "SYMLINK RESOLVES"; else echo "SYMLINK BROKEN"; fi
      - name: Prepare config
        run: |
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          # 修复断链 symlink：优先用原 target 重建（vendor 树已就位），仍断则 stub
          find . -type l | while read L; do
            if [ ! -e "$L" ]; then
              T=$(readlink "$L")
              rm -f "$L"
              ln -s "$T" "$L"
              if [ ! -e "$L" ]; then
                echo "stub broken symlink: $L"
                rm -f "$L"; mkdir -p "$L"; touch "$L/Kconfig"
              else
                echo "rebuilt symlink: $L -> $T"
              fi
            fi
          done
          # 兜底: Kconfig source 引用缺失文件
          grep -rhoP 'source\s+"[^"]+"' --include='Kconfig*' . \
            | sed -E 's/.*"([^"]+)"/\1/' | grep -v '\$' | sort -u | while read F; do
              if [ ! -f "$F" ]; then
                echo "fix missing kconfig: $F"
                mkdir -p "$(dirname "$F")"; touch "$F"
              fi
            done
          cp arch/arm64/configs/wiko_gar_an60_defconfig .config
          make olddefconfig
          echo "--- key config ---"
          grep -E "^CONFIG_(LOCALVERSION|MODULES|KALLSYMS|SECURITY_SELINUX|ARM64_VA_BITS)" .config
      - name: Build vmlinux
        run: |
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc) vmlinux
      - name: Check System.map
        run: |
          ls -la System.map
          head -3 System.map
          echo "--- symbol check ---"
          grep -E " (init_task|selinux_state|init_cred|init_user_ns)$" System.map || true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: systemmap-wiko
          path: |
            System.map
            .config
