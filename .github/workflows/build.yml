name: build-systemmap-wiko
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'arch/arm64/configs/wiko_gar_an60_defconfig'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu libssl-dev flex bison bc
          aarch64-linux-gnu-gcc --version | head -1
      - name: Prepare config
        run: |
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          # OPPO 官方仓库存在大量断链 symlink (vendor/oplus 未开源)，批量修复：
          # 断链 -> 同名目录 + 空 Kconfig（华为 config 无 OPLUS 选项，不会引用其源码）
          find . -type l | while read L; do
            if [ ! -e "$L" ]; then
              echo "fix broken symlink: $L"
              rm -f "$L"; mkdir -p "$L"; touch "$L/Kconfig"
            fi
          done
          # 修复 Kconfig source 引用了但缺失的文件 (OPPO vendor 树未开源导致)
          grep -rhoP 'source\\s+"[^"]+"' --include='Kconfig*' . \
            | sed 's/.*"\(.*\)"/\1/' | grep -v '\\$' | sort -u | while read F; do
              if [ ! -f "$F" ]; then
                echo "fix missing kconfig: $F"
                mkdir -p "$(dirname "$F")"; touch "$F"
              fi
            done
          cp arch/arm64/configs/wiko_gar_an60_defconfig .config
          make olddefconfig
          echo "--- key config ---"
          grep -E "^CONFIG_(LOCALVERSION|MODULES|KALLSYMS|SECURITY_SELINUX|ARM64_VA_BITS)" .config
      - name: Build vmlinux
        run: |
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc) vmlinux
      - name: Check System.map
        run: |
          ls -la System.map
          head -3 System.map
          echo "--- symbol check ---"
          grep -E " (init_task|selinux_state|init_cred|init_user_ns)$" System.map || true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: systemmap-wiko
          path: |
            System.map
            .config
